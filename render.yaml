services:
  - type: web
    name: careflow
    runtime: node
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: careflow
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_NAME
        value: CareFlow District Super Admin
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
